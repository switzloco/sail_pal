name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: ".exe"
          # macOS Apple Silicon. GitHub's macos-latest runners are now M-series
          # by default, which matches the dominant install base. The build is
          # UNSIGNED — first launch will hit Gatekeeper and the user has to
          # right-click → Open once. Code signing requires an Apple Developer
          # cert ($99/yr) which we'll add before this goes to crew who aren't
          # willing to do that. The PyInstaller spec + Tauri config already support
          # macOS targets; only the matrix needed re-enabling.
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.toml') }}

      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.11.*

      - name: Bake cloud preview key into .env
        shell: bash
        env:
          GOOGLE_API_KEY_PREVIEW: ${{ secrets.GOOGLE_API_KEY_PREVIEW }}
        run: |
          if [ -n "$GOOGLE_API_KEY_PREVIEW" ]; then
            # Bake the key so users CAN switch to cloud mode from the UI,
            # but do NOT set CLOUD_MODE=true — the desktop app defaults to
            # local and the user chooses. Forcing cloud here blocks
            # setMode("local") with a 409 and shows "Cloud Mode" banner.
            echo "GOOGLE_API_KEY=${GOOGLE_API_KEY_PREVIEW}" >> .env
            echo "CLOUD_MODEL=gemma-4-26b-a4b-it" >> .env
            echo "✓ Cloud preview key baked into .env (CLOUD_MODE left unset — defaults to local)"
          else
            echo "⚠ GOOGLE_API_KEY_PREVIEW not set — building without cloud preview key"
          fi

      - name: Build backend sidecar
        run: pyinstaller backend/pyinstaller.spec --clean --noconfirm

      - name: Stage sidecar for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          src="dist/vessel-ops-backend${{ matrix.sidecar_ext }}"
          dst="frontend/src-tauri/binaries/vessel-ops-backend-${{ matrix.target }}${{ matrix.sidecar_ext }}"
          cp "$src" "$dst"
          chmod +x "$dst" || true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Tauri app
        working-directory: frontend
        # Signing env vars are intentionally omitted while we ship unsigned
        # beta builds. Setting them to empty strings (which is what
        # `${{ secrets.X }}` evaluates to when the secret is unset) causes
        # Tauri to attempt codesign with an empty cert and fail. Re-add
        # individual vars conditionally if/when we set up Apple Developer
        # signing.
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Stage portable Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          stage="portable/staging/Vessel-Ops-AI_${version}_x64_portable"
          mkdir -p "$stage"
          # The Tauri launcher. Bundled installers rename this to the
          # productName, but for the portable layout we keep the cargo
          # output name so the sidecar lookup (which strips the target
          # triple) resolves to a sibling file.
          cp "frontend/src-tauri/target/${{ matrix.target }}/release/vessel-ops-ai.exe" \
             "$stage/Vessel Ops AI.exe"
          # Sidecar: tauri-plugin-shell looks for `<name>.exe` (no target
          # triple) next to the running launcher in production.
          cp "frontend/src-tauri/binaries/vessel-ops-backend-${{ matrix.target }}.exe" \
             "$stage/vessel-ops-backend.exe"
          cp README.md "$stage/README.md" 2>/dev/null || true
          (cd "portable/staging" && \
            7z a -tzip "../Vessel-Ops-AI_${version}_x64_portable.zip" \
              "Vessel-Ops-AI_${version}_x64_portable")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vessel-ops-ai-${{ matrix.target }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            portable/*.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true

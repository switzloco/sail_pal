[package]
name = "vessel-ops-ai"
version = "0.1.0"
description = "Vessel Ops AI — offline maritime assistant"
authors = ["Switzloco"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# devtools: enables right-click → Inspect Element in release builds.
# Critical for field diagnosis on Windows where stdout/stderr are
# discarded (windows_subsystem = "windows"). We're still in beta — leave
# it on. Strip the feature for v1.0 GA.
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

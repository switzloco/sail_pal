steps:
  # Build the backend container, pulling :latest first to warm the layer cache.
  # On cache hit the docker build step drops from ~7 min to ~1 min.
  - name: gcr.io/cloud-builders/docker
    args: [pull, gcr.io/$PROJECT_ID/vessel-ops-backend:latest]
    # Allow failure — image won't exist on the very first build
    allowFailure: true

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=gcr.io/$PROJECT_ID/vessel-ops-backend:latest
      - -t
      - gcr.io/$PROJECT_ID/vessel-ops-backend:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/vessel-ops-backend:latest
      - -f
      - Dockerfile
      - .

  # Push to Container Registry
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, gcr.io/$PROJECT_ID/vessel-ops-backend]

  # Deploy backend to Cloud Run. --ingress=all ensures the service accepts
  # external traffic even if a previous deploy restricted it.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_RUN_SERVICE}
      - --image=gcr.io/$PROJECT_ID/vessel-ops-backend:$BUILD_ID
      - --region=us-west1
      - --platform=managed
      - --allow-unauthenticated
      - --ingress=all
      - --port=8080
      - --memory=2Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      # USE_FIRESTORE / REQUIRE_AUTH are set explicitly rather than inherited
      # from CLOUD_MODE so that shipping this code and switching the hosted app
      # onto Firestore are two separate events. Deploying with them false keeps
      # the previous behaviour exactly; flip them on the Cloud Run service once
      # Firestore is provisioned and the Firebase config is in the trigger
      # (docs/FIREBASE_SETUP.md). No redeploy needed to flip them.
      #
      # VESSEL_OPS_DATA_DIR stays because the RAG index and uploads use it.
      - --set-env-vars=CLOUD_MODE=true,VESSEL_OPS_DATA_DIR=/tmp/data,FIREBASE_PROJECT_ID=$PROJECT_ID,USE_FIRESTORE=${_USE_FIRESTORE},REQUIRE_AUTH=${_REQUIRE_AUTH}
      - --set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest

  # Capture the live Cloud Run URL so the frontend bakes in the exact right base.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: get-backend-url
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_RUN_SERVICE} --region=us-west1 --format='value(status.url)')
        echo "$$URL" > /workspace/backend_url.txt
        echo "Backend URL: $$URL"
    waitFor: [deploy-backend]

  # Build the Next.js frontend as a static export, embedding the live Cloud Run URL.
  # node_modules is cached in GCS via the npm cache dir to speed up npm ci.
  - name: node:20-slim
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        echo "Building frontend with NEXT_PUBLIC_API_BASE=$$BACKEND_URL"
        cd frontend
        npm ci --cache /workspace/.npm-cache
        # Firebase web config is public by design — it identifies the project,
        # it does not grant access. Authorization is enforced by the API against
        # each vessel's membership. Without these the hosted app builds
        # unauthenticated, so set them as substitutions on the trigger.
        NEXT_PUBLIC_API_BASE="$$BACKEND_URL" \
        NEXT_PUBLIC_FIREBASE_API_KEY="${_FIREBASE_API_KEY}" \
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${_FIREBASE_AUTH_DOMAIN}" \
        NEXT_PUBLIC_FIREBASE_PROJECT_ID="$PROJECT_ID" \
        NEXT_PUBLIC_FIREBASE_APP_ID="${_FIREBASE_APP_ID}" \
        WEB_EXPORT=1 npm run build
    waitFor: [get-backend-url]

  # Deploy the static export to Firebase Hosting.
  #
  # Targets the dedicated site named in frontend/firebase.json ("site" key), not
  # the project's default site. This repo used to publish to the default site,
  # which another branch of the project also deployed to — so whichever built
  # last silently replaced the other. A named site gives this app its own URL.
  #
  # Requires the Cloud Build service account to have roles/firebasehosting.admin.
  - name: node:20-slim
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        cd frontend
        SITE=$(node -p "require('./firebase.json').hosting.site")
        echo "Deploying to Firebase Hosting site: $$SITE"
        # Idempotent — succeeds the first time, harmlessly fails afterwards.
        firebase hosting:sites:create "$$SITE" --project=$PROJECT_ID --non-interactive || true
        firebase deploy --only hosting --project=$PROJECT_ID --non-interactive
    waitFor: [build-frontend]

images:
  - gcr.io/$PROJECT_ID/vessel-ops-backend

# Firebase web config, from Firebase Console → Project settings → Your apps.
# Public values — they identify the project, they do not grant access. Set them
# as substitution variables on the Cloud Build trigger. Left empty, the hosted
# app builds without sign-in and every visitor shares one vessel.
substitutions:
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_APP_ID: ""
  # Both default off so a deploy never lands on a half-provisioned project.
  # Turn on together once Firestore exists and the service account has
  # roles/datastore.user — Firestore without auth would leave real crew medical
  # records readable by anyone who finds the URL.
  _USE_FIRESTORE: "false"
  _REQUIRE_AUTH: "false"
  # Cloud Run service this repo owns. Left as the existing service so nothing
  # moves unexpectedly; point it at a new name for a fully isolated stack.
  _RUN_SERVICE: "sail-pal"

options:
  logging: CLOUD_LOGGING_ONLY
  # Empty substitutions above are intentional defaults, not typos.
  substitution_option: ALLOW_LOOSE

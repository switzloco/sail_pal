steps:
  # Build the backend container
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/vessel-ops-backend:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/vessel-ops-backend:latest
      - -f
      - Dockerfile
      - .

  # Push to Container Registry
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, gcr.io/$PROJECT_ID/vessel-ops-backend]

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sail-pal
      - --image=gcr.io/$PROJECT_ID/vessel-ops-backend:$SHORT_SHA
      - --region=us-west1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      # GOOGLE_API_KEY is set separately in Cloud Run env vars via the console
      # so it never appears in source. Set CLOUD_MODE here since it's not secret.
      - --set-env-vars=CLOUD_MODE=true,VESSEL_OPS_DATA_DIR=/tmp/data

  # Build the Next.js frontend as a static export.
  # NEXT_PUBLIC_API_BASE is intentionally set to "" so the app uses relative
  # paths that Firebase Hosting proxies to the Cloud Run backend via the
  # rewrites defined in frontend/firebase.json.
  - name: node:20-slim
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        cd frontend
        npm ci
        NEXT_PUBLIC_API_BASE="" WEB_EXPORT=1 npm run build
    waitFor: [deploy-backend]

  # Deploy the static export to Firebase Hosting
  - name: node:20-slim
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        cd frontend
        firebase deploy --only hosting --project=$PROJECT_ID --non-interactive
    waitFor: [build-frontend]

images:
  - gcr.io/$PROJECT_ID/vessel-ops-backend

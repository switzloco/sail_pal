steps:
  # Build the backend container
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/vessel-ops-backend:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/vessel-ops-backend:latest
      - -f
      - Dockerfile
      - .

  # Push to Container Registry
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, gcr.io/$PROJECT_ID/vessel-ops-backend]

  # Deploy backend to Cloud Run. --ingress=all ensures the service accepts
  # external traffic even if a previous deploy restricted it.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sail-pal
      - --image=gcr.io/$PROJECT_ID/vessel-ops-backend:$SHORT_SHA
      - --region=us-west1
      - --platform=managed
      - --allow-unauthenticated
      - --ingress=all
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      # GOOGLE_API_KEY is set separately in Cloud Run env vars via the console
      # so it never appears in source. Set CLOUD_MODE here since it's not secret.
      - --set-env-vars=CLOUD_MODE=true,VESSEL_OPS_DATA_DIR=/tmp/data

  # Capture the live Cloud Run URL so the frontend bakes in the exact right base.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: get-backend-url
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe sail-pal --region=us-west1 --format='value(status.url)')
        echo "$$URL" > /workspace/backend_url.txt
        echo "Backend URL: $$URL"
    waitFor: [deploy-backend]

  # Build the Next.js frontend as a static export, embedding the live Cloud Run URL.
  - name: node:20-slim
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        echo "Building frontend with NEXT_PUBLIC_API_BASE=$$BACKEND_URL"
        cd frontend
        npm ci
        NEXT_PUBLIC_API_BASE="$$BACKEND_URL" WEB_EXPORT=1 npm run build
    waitFor: [get-backend-url]

  # Deploy the static export to Firebase Hosting.
  # Requires the Cloud Build service account to have roles/firebasehosting.admin.
  - name: node:20-slim
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        cd frontend
        firebase deploy --only hosting --project=$PROJECT_ID --non-interactive
    waitFor: [build-frontend]

images:
  - gcr.io/$PROJECT_ID/vessel-ops-backend

options:
  logging: CLOUD_LOGGING_ONLY
